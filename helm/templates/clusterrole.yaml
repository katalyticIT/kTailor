apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ktailor.fullname" . }}
  labels:
    {{- include "ktailor.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ktailor.fullname" . }}
  labels:
    {{- include "ktailor.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ktailor.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ktailor.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}

