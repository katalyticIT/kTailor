#
# route incoming calles on https/443 to the kTailor pods on https/8443
#
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ktailor.fullname" . }}
  labels:
    {{- include "ktailor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: https
  selector:
    {{- include "ktailor.selectorLabels" . | nindent 4 }}
