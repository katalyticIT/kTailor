apiVersion: v1
kind: Service
metadata:
  name: {{ include "ktailor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ktailor.labels" . | nindent 4 }}
  {{- if or (eq .Values.certs.provider "openshift") .Values.service.annotations }}
  annotations:
    {{- if eq .Values.certs.provider "openshift" }}
    service.beta.openshift.io/serving-cert-secret-name: {{ include "ktailor.certSecretName" . | quote }}
    {{- end }}
    {{- with .Values.service.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: https
  selector:
    {{- include "ktailor.selectorLabels" . | nindent 4 }}
