{{/*
  Prüft vor der Installation, ob die cert-manager CRDs (cert-manager.io/v1)
  im Cluster verfügbar sind, sofern certs.provider="cert-manager" gesetzt ist.
*/}}
{{- if eq .Values.certs.provider "cert-manager" }}
{{- if not (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
{{- $failMessage := `
---------------------------------------------------------------------
prerequisites.yaml - checking if cert-manager is installed.

kTailor is configured with certs.provider="cert-manager", which
requires cert-manager to be installed and working properly in the
cluster before attempting to install kTailor.

For more information on installing cert-manager, please visit:
https://cert-manager.io/docs/installation/

On OpenShift without cert-manager, you can alternatively use the
built-in Service Serving Certificate Signer by setting:
  --set certs.provider=openshift

If you receive this message during a helm template run, then
try adding "--dry-run=server".
---------------------------------------------------------------------` }}
{{- fail $failMessage }}
{{- end }}
{{- end }}
