{{- if .Values.webhook.enabled -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "ktailor.fullname" . }}
  labels:
    {{- include "ktailor.labels" . | nindent 4 }}
  annotations:
    {{- if eq .Values.certs.provider "cert-manager" }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ .Values.certs.certificateName | default (printf "%s-serving-cert" (include "ktailor.fullname" .)) }}
    {{- else if eq .Values.certs.provider "openshift" }}
    service.beta.openshift.io/inject-cabundle: "true"
    {{- end }}
    {{- with .Values.webhook.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
webhooks:
  - name: mutate.ktailor.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy | default "Ignore" }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds | default 10 }}
    {{- with .Values.webhook.namespaceSelector }}
    namespaceSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    clientConfig:
      service:
        name: {{ include "ktailor.fullname" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate
    rules:
      - operations: ["CREATE", "UPDATE"]
        apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
{{- end }}
